<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Road Pavement Deterioration Model</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 45px 30px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header h1 {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .login-header p {
            color: #64748b;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .register-button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
        }
        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        .register-footer {
            text-align: center;
            margin-top: 25px;
        }
        .register-footer p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .register-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .register-footer a:hover {
            color: #1e40af;
            text-decoration: underline;
        }
        .password-requirements {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #0c4a6e;
        }
        .password-requirements h4 {
            margin-top: 0;
            color: #0c4a6e;
        }
        .password-requirements ul {
            margin: 8px 0;
            padding-left: 20px;
        }
        .password-requirements li {
            margin: 4px 0;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
            .login-header h1 { font-size: 24px; }
        }
    </style>
</head>
<body style="background: none; padding: 0;">
    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-box">
                <div class="login-header">
                    <h1>Create Account</h1>
                    <p>Road Pavement Detection System</p>
                </div>
                {% if error %}
                <p style="margin-bottom: 16px; color: #dc2626; text-align: center; font-weight: 600;">{{ error }}</p>
                {% endif %}
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="register-button">Create Account</button>
                </form>
                <div class="password-requirements">
                    <h4>Password Requirements:</h4>
                    <ul>
                        <li>At least 8 characters long</li>
                        <li>Include uppercase letters (A-Z)</li>
                        <li>Include lowercase letters (a-z)</li>
                        <li>Include numbers (0-9)</li>
                    </ul>
                </div>
                <div class="register-footer">
                    <p>Already have an account?</p>
                    <a href="{{ url_for('login_page') }}">Login here</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
